name: Copy release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to copy from photexnp/Photexbot"
        default: "v1.0.3"
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - run: |
          gh release download "$TAG" --repo photexnp/Photexbot -D dist
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Photexbot ${TAG#v}" --notes-file - <<'NOTES'
          Risk indicators replace the safety guard: every action shows a Low / Medium / High / Critical badge with the reason, and High and Critical actions wait for your approval (change it in Settings → Ask before).

          Pick the file for your computer below. See the [install guide](https://github.com/photexnp/Photexbot-releases/blob/main/INSTALL.md) for first-launch steps.
          NOTES
